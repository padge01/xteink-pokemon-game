name: Compile Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-candidate:
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    env:
      RC_BRANCH: ${{ github.ref_name }}
      RC_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Resolve release-candidate metadata
        shell: bash
        run: |
          branch_without_prefix="${RC_BRANCH#release/}"
          branch_safe=$(printf '%s\n' "$branch_without_prefix" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          hash_short="${RC_HASH::7}"
          rc_tag="rc-${branch_safe}-${hash_short}"
          echo "RC_BRANCH_RAW=$branch_without_prefix" >> "$GITHUB_ENV"
          echo "RC_BRANCH_SAFE=$branch_safe" >> "$GITHUB_ENV"
          echo "RC_HASH_SHORT=$hash_short" >> "$GITHUB_ENV"
          echo "RC_TAG=$rc_tag" >> "$GITHUB_ENV"
          echo "VERSION=${branch_safe}-RC" >> "$GITHUB_ENV"

      - name: Set version from branch
        shell: bash
        run: |
          VERSION="${RC_BRANCH_RAW}-RC"
          escaped_version=$(printf '%s\n' "$VERSION" | sed 's/[&|]/\\&/g')
          sed -i "/^\[crossink\]$/,/^\[/s|^version = .*|version = ${escaped_version}|" platformio.ini

      - name: Build Pokémon firmware
        env:
          CROSSINK_RELEASE_VERSION: ${{ env.VERSION }}
        run: pio run -j1 -e pokemon-x3

      - name: Package release candidate
        run: >-
          python3 scripts/build_pokemon_release.py
          --firmware .pio/build/pokemon-x3/firmware-x3-x4-v${{ env.VERSION }}.bin
          --version "${{ env.VERSION }}"
          --output dist

      - name: Create GitHub RC Prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RC_TAG }}
          target_commitish: ${{ github.sha }}
          name: RC ${{ env.RC_BRANCH_SAFE }} ${{ env.RC_HASH_SHORT }}
          body: |
            Hardware-test candidate from `release/${{ env.RC_BRANCH_RAW }}` at `${{ env.RC_HASH_SHORT }}`.

            Install this exact candidate:
            https://padge01.github.io/xteink-pokemon-game/install.html?release=${{ env.RC_TAG }}
          draft: false
          prerelease: true
          files: |
            dist/xteink-pokemon-x3-v${{ env.VERSION }}.bin
            dist/SHA256SUMS
